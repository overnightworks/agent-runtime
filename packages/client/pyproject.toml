[project]
name = "overnightworks-agent-runtime-client"
version = "0.20.0"
description = "Light client of the overnightworks agent service: the tool contract an app declares and the streamed run contract the service speaks"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.19.1,<0.20",
]

[project.optional-dependencies]
backend = [
    "httpx2>=2.12,<3",
]
# The workspace's `--extra dev` sync installs the backend extra for the tests.
dev = ["overnightworks-agent-runtime-client[backend]"]
mcp-server = [
    "pyjwt[crypto]>=2.15.1,<3",
    "cryptography>=50.0.2",
]

[project.urls]
Repository = "https://github.com/overnightworks/agent-runtime"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_runtime_client*"]

[tool.setuptools.package-data]
agent_runtime_client = ["py.typed"]
