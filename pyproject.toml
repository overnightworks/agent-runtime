[project]
name = "overnightworks-agent-runtime-client"
version = "0.25.0"
description = "Light client for apps that run agents: the agent file, the tool contract an app declares and the gateway backend"
authors = [{ name = "Flex0r (Felix Hummert)", email = "felix.hummert@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.14"

dependencies = [
    "pydantic>=2.12,<3",
    "ruamel.yaml>=0.19.1,<0.20",
]

[project.optional-dependencies]
backend = [
    "httpx2>=2.12,<3",
]
mcp-server = [
    "anyio>=4.12,<5",
    "mcp>=2.3,<3",
]
dev = [
    "overnightworks-agent-runtime-client[backend,mcp-server]",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<1",
    "cryptography>=50.0.2",
    "fastapi>=0.133,<1",
    "uvicorn>=0.54,<1",
]

[project.urls]
Repository = "https://github.com/overnightworks/agent-runtime"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_runtime_client*"]

[tool.setuptools.package-data]
agent_runtime_client = ["py.typed"]

[tool.ruff]
target-version = "py314"
src = ["src", "."]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
