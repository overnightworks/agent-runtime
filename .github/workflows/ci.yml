name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Host vocabulary stays out of the tree
        env:
          HOST_VOCABULARY: 'co-?writer|cowriter|song|lyric|cover[ _-]?image|album|musician|judge([^a-z]|$)|\b(bpm|key_scale|audio_duration|tempo|set_tempo|verse|chorus|rhyme|vers)\b'
        run: |
          hits=$(git grep -n -i -E "$HOST_VOCABULARY" -- src tests docs) || [ $? -eq 1 ]
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff
        run: uv run --locked --no-sync ruff check src tests

      - name: Tests
        run: uv run --locked --no-sync pytest -q -n auto --cov=src --cov-report=xml:coverage.xml

      - name: Upload the coverage report for the quality gate
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

      - name: Build the distribution
        run: uv build

      - name: The client wheel carries the repository licence
        run: |
          licence="$(mktemp -d "$RUNNER_TEMP/client-licence.XXXXXX")"
          python3 -I -m zipfile -e dist/overnightworks_agent_runtime_client-*-py3-none-any.whl "$licence"
          cmp LICENSE "$licence"/overnightworks_agent_runtime_client-*.dist-info/licenses/LICENSE

      - name: The client wheel imports alone, without its extras
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/client-only.XXXXXX")"
          uv venv "$proof/venv"
          uv pip install --python "$proof/venv/bin/python" \
            "$GITHUB_WORKSPACE"/dist/overnightworks_agent_runtime_client-*-py3-none-any.whl
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import importlib
          import importlib.util
          import pkgutil

          import agent_runtime_client

          assert importlib.util.find_spec("anyio") is None, "the mcp-server extra leaked in"
          for module in pkgutil.walk_packages(agent_runtime_client.__path__, "agent_runtime_client."):
              if module.name == "agent_runtime_client.mcp_server" or module.name.startswith(
                  "agent_runtime_client.mcp_server."
              ) or module.name == "agent_runtime_client.voice" or module.name.startswith(
                  "agent_runtime_client.voice."
              ) or module.name in (
                  "agent_runtime_client.backend.gateway",
                  "agent_runtime_client.backend.fake_gateway",
              ):
                  continue
              importlib.import_module(module.name)
              print("imported", module.name)
          '

      - name: The client wheel with the mcp-server extra imports its server half
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/client-mcp-server.XXXXXX")"
          uv venv "$proof/venv"
          client_wheel="$(ls "$GITHUB_WORKSPACE"/dist/overnightworks_agent_runtime_client-*-py3-none-any.whl)"
          uv pip install --python "$proof/venv/bin/python" "$client_wheel[mcp-server]"
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import agent_runtime_client.mcp_server

          print("imported", agent_runtime_client.mcp_server.__name__)
          '

      - name: The client wheel with the backend extra imports the gateway backend
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/client-backend.XXXXXX")"
          uv venv "$proof/venv"
          client_wheel="$(ls "$GITHUB_WORKSPACE"/dist/overnightworks_agent_runtime_client-*-py3-none-any.whl)"
          uv pip install --python "$proof/venv/bin/python" "$client_wheel[backend]"
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import agent_runtime_client.backend.fake_gateway
          import agent_runtime_client.backend.gateway

          print("imported", agent_runtime_client.backend.gateway.__name__)
          '

      - name: The client wheel with the voice extra imports its voice half
        run: |
          proof="$(mktemp -d "$RUNNER_TEMP/client-voice.XXXXXX")"
          uv venv "$proof/venv"
          client_wheel="$(ls "$GITHUB_WORKSPACE"/dist/overnightworks_agent_runtime_client-*-py3-none-any.whl)"
          uv pip install --python "$proof/venv/bin/python" "$client_wheel[voice]"
          cd "$proof"
          "$proof/venv/bin/python" -I -c '
          import importlib
          import pkgutil

          import agent_runtime_client.voice

          for module in pkgutil.walk_packages(
              agent_runtime_client.voice.__path__, "agent_runtime_client.voice."
          ):
              importlib.import_module(module.name)
              print("imported", module.name)
          '

  checks:
    name: checks
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every Python minor passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success

  dependency-floors:
    name: dependency-floors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Install the lowest declared direct dependencies
        run: |
          uv lock
          uv sync --frozen --extra dev

      - name: Versions the suite runs against
        run: uv pip list

      - name: Tests
        run: uv run --no-sync pytest -q -n auto

  quality:
    needs: [checks, dependency-floors]
    if: always()
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
