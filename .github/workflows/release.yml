name: Release

# The tag is immutable, so quality's gate reads and refuses before any tag exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, X.Y.Z
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Gate
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    uses: overnightworks/quality/.github/workflows/release-gate.yml@be32abeb120d29f75ee7ea456d6e510ae001de04 # v0.12.0
    with:
      version: ${{ inputs.version }}

  build:
    name: Build
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      install: ${{ steps.install.outputs.install }}
    env:
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ needs.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refuse unless the checkout is the commit the gate judged
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$COMMIT" ]; then
            echo "Refused: the checkout is $head, not the gated commit $COMMIT." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false

      - name: Build the distribution
        run: uv build

      - name: Refuse unless the build holds exactly the client wheel at the version
        run: |
          expected="overnightworks_agents-${VERSION}-py3-none-any.whl"
          built="$(cd dist && ls -- *.whl | sort)"
          if [ "$built" != "$expected" ]; then
            echo "Refused: the build must hold exactly this wheel:" >&2
            echo "$expected" >&2
            echo "but it holds:" >&2
            echo "$built" >&2
            exit 1
          fi

      - name: Write the release note naming the git tag
        id: install
        run: |
          {
            echo 'install<<INSTALL_LINES'
            echo '**Install.** Pin the git tag.'
            echo
            echo '```'
            echo "overnightworks-agents @ git+https://github.com/${GITHUB_REPOSITORY}@v${VERSION}"
            echo '```'
            echo 'INSTALL_LINES'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  tag:
    name: Tag
    needs: [gate, build]
    permissions:
      contents: write
    uses: overnightworks/quality/.github/workflows/release-tag.yml@be32abeb120d29f75ee7ea456d6e510ae001de04 # v0.12.0
    with:
      version: ${{ inputs.version }}
      commit: ${{ needs.gate.outputs.commit }}
      artifact: wheels
      notes: ${{ needs.build.outputs.install }}
